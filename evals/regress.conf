# Settings for evals/regress.sh. An environment variable of the same name wins for one run.
# REGRESS_BASE is not a key here. It comes from the environment only, so a branch cannot
# point its own gate at its own baseline. The default is origin/main.
REGRESS_MARGIN=0.34
REGRESS_MODEL=claude-sonnet-5-5
REGRESS_JUDGE_MODEL=claude-haiku-5-5
REGRESS_RUNS=3
REGRESS_CONCURRENCY=4
# TODO(skill-regression-evals): set from the measured full run on main.
REGRESS_MAX_COST_USD=10
