# Overrides for the built-in defaults in evals/regress.sh. Add a KEY=value line only to change a
# default. The hook and --check read this file from REGRESS_BASE, never from the working tree.
# An environment variable of the same name wins for one run.
# Keys: REGRESS_MARGIN, REGRESS_MODEL, REGRESS_JUDGE_MODEL, REGRESS_RUNS, REGRESS_MAX_COST_USD,
# REGRESS_CONCURRENCY. REGRESS_BASE is not a key. It comes from the environment only, so a branch
# cannot point its own gate at its own baseline.
